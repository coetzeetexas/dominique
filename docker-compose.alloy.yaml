services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: bash -lc "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  node_modules:
